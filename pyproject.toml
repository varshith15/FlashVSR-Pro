[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashvsr"
version = "0.1.0"
description = "FlashVSR plugin for Daydream Scope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torchaudio==2.9.1",
    "torchmetrics",
    "torchsde",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0,<2",
    "opencv-python>=4.11.0",
    "opencv-python-headless>=4.11.0",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "pytorch-lightning>=2.5.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "protobuf==3.20.3",
    "pandas>=2.0.0",
    "tqdm",
    "datasets",
    "ffmpeg-python",
    "modelscope",
]

[project.optional-dependencies]
block-sparse = [
    "block-sparse-attn",
]

[project.entry-points.scope]
flashvsr = "flashvsr_scope_plugin"

[tool.uv]
override-dependencies = [
    "torchaudio==2.9.1",
]

[tool.uv.sources]
block-sparse-attn = { path = "./Block-Sparse-Attention" }

[tool.uv.extra-build-dependencies]
block-sparse-attn = ["torch==2.9.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["diffsynth*", "flashvsr_utils*", "flashvsr_scope_plugin*"]
namespaces = false

[tool.setuptools.package-dir]
flashvsr_scope_plugin = "flashvsr_scope_plugin"
